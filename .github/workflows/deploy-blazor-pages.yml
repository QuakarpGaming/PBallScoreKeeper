name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore dependencies
        run: dotnet restore PBSK/PBSK.Web.Client/PBSK.Web.Client.csproj

      - name: Publish Blazor WebAssembly
        run: dotnet publish PBSK/PBSK.Web.Client/PBSK.Web.Client.csproj --configuration Release --output publish

      - name: Create GitHub Pages host page
        run: |
          cat > publish/wwwroot/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <base href="/PBallScoreKeeper/" />
            <title>PBall Score Keeper</title>
            <link rel="stylesheet" href="_content/PBSK.Shared/lib/bootstrap/dist/css/bootstrap.min.css" />
            <link rel="stylesheet" href="_content/PBSK.Shared/app.css" />
          </head>
          <body>
            <div id="app"></div>
            <script src="_content/PBSK.Shared/speech.js"></script>
            <script src="_framework/blazor.webassembly.js"></script>
          </body>
          </html>
          EOF

      - name: Add GitHub Pages fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
